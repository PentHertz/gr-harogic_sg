id: harogic_sg_sink
label: 'Harogic SG: Sink'
category: '[Harogic SG]'
flags: [python, cpp]

parameters:
- id: device_index
  label: Device Index
  dtype: int
  default: '0'
- id: mode
  label: Mode
  dtype: int
  default: '0'
  options: ['0', '1', '2', '3']
  option_labels: [GNU Radio IQ, CW, Frequency Sweep, Level Sweep]
- id: frequency
  label: Frequency (Hz)
  dtype: real
  default: '868.3e6'
  hide: ${ 'all' if mode == 2 else 'none' }
- id: level
  label: Level (dBm)
  dtype: real
  default: '-30'
  hide: ${ 'all' if mode == 3 else 'none' }
- id: samp_rate
  label: Sample Rate (S/s)
  dtype: real
  default: samp_rate
  hide: ${ 'none' if mode == 0 else 'part' }
- id: rf_on
  label: RF Output
  dtype: bool
  default: 'True'
  options: ['True', 'False']
  option_labels: ['On', 'Off']
- id: scale
  label: IQ Scale
  dtype: real
  default: '1.0'
  hide: ${ 'none' if mode == 0 else 'all' }
- id: sweep_start
  label: Sweep Start (Hz)
  dtype: real
  default: '868.0e6'
  hide: ${ 'none' if mode == 2 else 'all' }
- id: sweep_stop
  label: Sweep Stop (Hz)
  dtype: real
  default: '868.6e6'
  hide: ${ 'none' if mode == 2 else 'all' }
- id: sweep_step
  label: Sweep Step (Hz)
  dtype: real
  default: '100e3'
  hide: ${ 'none' if mode == 2 else 'all' }
- id: level_start
  label: Level Start (dBm)
  dtype: real
  default: '-40'
  hide: ${ 'none' if mode == 3 else 'all' }
- id: level_stop
  label: Level Stop (dBm)
  dtype: real
  default: '-10'
  hide: ${ 'none' if mode == 3 else 'all' }
- id: level_step
  label: Level Step (dB)
  dtype: real
  default: '1'
  hide: ${ 'none' if mode == 3 else 'all' }
- id: dwell
  label: Dwell per Point (s)
  dtype: real
  default: '0.1'
  hide: ${ 'none' if mode in (2, 3) else 'all' }
- id: freq_offset
  label: Freq. Offset (Hz)
  dtype: real
  default: '0'
  category: Advanced
- id: phase_offset
  label: Phase Offset (rad)
  dtype: real
  default: '0'
  category: Advanced
- id: lo_mode
  label: LO Mode
  dtype: int
  default: '0'
  options: ['0', '1', '2', '3']
  option_labels: [Auto, High Speed, Low Spur, Low Phase Noise]
  category: Advanced
- id: rf_port
  label: RF Port
  dtype: int
  default: '0'
  options: ['0', '1']
  option_labels: [Standard, High Power (option)]
  category: Advanced
- id: max_latency_ms
  label: Max Latency (ms)
  dtype: real
  default: '50'
  category: Advanced
- id: ext_ref
  label: Reference Clock
  dtype: bool
  default: 'False'
  options: ['False', 'True']
  option_labels: [Internal, External]
  category: Reference
- id: ref_freq
  label: Ext. Ref. Frequency (Hz)
  dtype: real
  default: '10e6'
  hide: ${ 'none' if ext_ref else 'all' }
  category: Reference
- id: ref_out
  label: Reference Output
  dtype: bool
  default: 'False'
  options: ['False', 'True']
  option_labels: ['Off', 'On']
  category: Reference

inputs:
- domain: stream
  dtype: complex
  optional: true
  hide: ${ mode != 0 }
- domain: message
  id: cmd
  optional: true

asserts:
- ${ samp_rate >= 195312.5 and samp_rate <= 62.5e6 }
- ${ device_index >= 0 }
- ${ mode != 2 or (sweep_step > 0 and sweep_stop > sweep_start) }
- ${ mode not in (2, 3) or dwell > 0 }

templates:
  imports: from gnuradio import harogic_sg
  make: |-
    harogic_sg.sink(
        device_index=${device_index},
        mode=${mode},
        frequency=${frequency},
        level=${level},
        samp_rate=${samp_rate},
        rf_on=${rf_on},
        scale=${scale},
        sweep_start=${sweep_start},
        sweep_stop=${sweep_stop},
        sweep_step=${sweep_step},
        level_start=${level_start},
        level_stop=${level_stop},
        level_step=${level_step},
        dwell=${dwell},
        freq_offset=${freq_offset},
        phase_offset=${phase_offset},
        lo_mode=${lo_mode},
        rf_port=${rf_port},
        ext_ref=${ext_ref},
        ref_freq=${ref_freq},
        ref_out=${ref_out},
        max_latency_ms=${max_latency_ms})
  callbacks:
  - set_mode(${mode})
  - set_frequency(${frequency})
  - set_level(${level})
  - set_samp_rate(${samp_rate})
  - set_rf_on(${rf_on})
  - set_scale(${scale})
  - set_sweep(${sweep_start}, ${sweep_stop}, ${sweep_step})
  - set_level_sweep(${level_start}, ${level_stop}, ${level_step})
  - set_dwell(${dwell})
  - set_freq_offset(${freq_offset})
  - set_phase_offset(${phase_offset})
  - set_lo_mode(${lo_mode})
  - set_max_latency_ms(${max_latency_ms})

cpp_templates:
  includes: ['#include <gnuradio/harogic_sg/sink.h>']
  declarations: 'gr::harogic_sg::sink::sptr ${id};'
  make: 'this->${id} = gr::harogic_sg::sink::make(${device_index}, ${mode}, ${frequency}, ${level}, ${samp_rate}, ${rf_on}, ${scale}, ${sweep_start}, ${sweep_stop}, ${sweep_step}, ${level_start}, ${level_stop}, ${level_step}, ${dwell}, ${freq_offset}, ${phase_offset}, ${lo_mode}, ${rf_port}, ${ext_ref}, ${ref_freq}, ${ref_out}, ${max_latency_ms});'
  link: ['gnuradio::gnuradio-harogic_sg']
  callbacks:
  - set_mode(${mode})
  - set_frequency(${frequency})
  - set_level(${level})
  - set_samp_rate(${samp_rate})
  - set_rf_on(${rf_on})
  - set_scale(${scale})

documentation: |-
  Transmits with a Harogic H2 signal generator. Mode (changeable while running):

    GNU Radio IQ    - streams the complex input in real time (195.3125 kS/s .. 62.5 MS/s).
                      |x| <= 1.0 after "IQ Scale" (1.0 = int16 full scale, clipped).
                      The block paces itself to the sample rate: no Throttle needed.
    CW              - carrier at Frequency / Level
    Frequency Sweep - Sweep Start -> Stop in Sweep Step, Dwell seconds per point, repeated
    Level Sweep     - at Frequency, Level Start -> Stop in Level Step, Dwell seconds per point

  The input is optional (hidden outside GNU Radio IQ mode). In CW / sweep modes a connected
  input is consumed at the sample rate and discarded, so you can switch modes at runtime with a
  QT GUI Chooser bound to "Mode".

  Every setting can be changed while running; each change briefly re-arms the generator.
  Message port "cmd": dict with any of mode, freq, level, rf, samp_rate, freq_offset, phase_offset,
  lo_mode, sweep_start, sweep_stop, sweep_step, level_start, level_stop, level_step, dwell,
  e.g. {'mode': 1, 'freq': 868.3e6, 'level': -20, 'rf': True}

  The generator is opened when the flowgraph is created. RF is switched off when the flowgraph
  stops or exits (Ctrl-C, GRC Kill). Close SGStudio first: only one program can use the generator.
  Calibration: libh2api reads <python3 dir>/CalFile/<model>.ini (usually /usr/bin/CalFile/132.ini).

file_format: 1
